name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.2 (needed to reach FluidAudio's
      # NemoTextProcessing opt-out trait). SwiftPM hard-fails if the selected toolchain is
      # older, so pick the newest Xcode on the image rather than the default, and print the
      # version — if this job ever fails at "Build", that line says why.
      - name: Select the newest Xcode and report the toolchain
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            app/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Build
        run: swift build

      - name: Unit tests (OpenWhispererKit)
        run: swift run OpenWhispererKitTests

      - name: Hook integration tests
        run: swift run HookTests
